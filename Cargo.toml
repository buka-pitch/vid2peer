[workspace]
resolver = "2"
members = [
    "rust-core",
    "bootstrap-node",
    "relay-node",
    "android-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["P2P Video Chat Contributors"]

[workspace.dependencies]
libp2p = { version = "0.56", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
hex = "0.4"

[profile.release]
lto = true
