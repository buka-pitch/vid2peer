[package]
name = "relay-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Circuit relay node for the decentralized P2P video chat network"

[dependencies]
p2p-video-chat-core = { path = "../rust-core" }
libp2p = { workspace = true, features = ["tcp", "noise", "yamux", "identify", "ping", "kad", "mdns", "relay", "macros", "tokio", "serde"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
futures = { workspace = true }
